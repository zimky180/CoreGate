[package]
name = "coregated"
version = "2.4.1"
edition = "2021"
license = "MIT"
description = "CoreGate read-only configuration and hardware observer"
rust-version = "1.74"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"